      <div style="font-size:15px;color:#9AA0AB">יעד 4 × 8 · מעלים משקל כשכל הסטים מגיעים ל-8</div>

    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-radius:12px;background:#1A1D23;border:1px solid #2C313B">
        <span style="font-size:14px;font-weight:600;color:#9AA0AB">סט 1</span>

        <span style="font-size:18px;font-weight:500">82.5 ק״ג × 6</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C8F135" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="הושלם"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>

          <div style="display:flex;align-items:baseline;gap:6px"><span dir="ltr" style="font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:700;line-height:1">82.5</span><span style="font-size:16px;color:#9AA0AB">ק״ג</span></div>
          <button aria-label="הקטנת משקל" style="width:56px;height:56px;border-radius:14px;border:1px solid #2C313B;background:#232730;color:#F3F4F1;font-size:28px;line-height:1;cursor:pointer">−</button>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button aria-label="הגדלת חזרות" style="width:56px;height:56px;border-radius:14px;border:1px solid #2C313B;background:#232730;color:#F3F4F1;font-size:28px;line-height:1;cursor:pointer">+</button>
