<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#101216;color:#F3F4F1;font-family:'Barlow',system-ui,sans-serif;overflow:hidden">
  <div style="padding:28px 20px 12px 20px">
    <h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:700;line-height:1;text-transform:uppercase">Progress</h1>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;gap:14px;padding:4px 20px 0 20px;min-height:0">
    <button style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;border-radius:14px;border:1px solid #2C313B;background:#1A1D23;color:#F3F4F1;font-family:inherit;font-size:17px;font-weight:500;cursor:pointer">
      <span>Barbell Bench Press</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA0AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div style="display:flex;padding:4px;border-radius:12px;background:#1A1D23;gap:4px;border:1px solid #2C313B">
      <button style="flex:1;height:40px;border:0;border-radius:9px;background:#C8F135;color:#101216;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">Weight</button>
      <button style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:#F3F4F1;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer">Reps</button>
      <button style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:#F3F4F1;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer">Est. 1RM</button>
    </div>

    <div style="padding:16px;border-radius:16px;background:#1A1D23;border:1px solid #2C313B;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:13px;color:#9AA0AB">Heaviest set per session</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700">80 kg</span>
      </div>
      <svg width="318" height="190" viewBox="0 0 350 190" role="img" aria-label="Line chart: heaviest set rose from 70 kg to 80 kg over 8 sessions">
        <g stroke="#2C313B" stroke-width="1">
          <line x1="44" y1="20" x2="340" y2="20"/>
          <line x1="44" y1="70" x2="340" y2="70"/>
          <line x1="44" y1="120" x2="340" y2="120"/>
          <line x1="44" y1="170" x2="340" y2="170"/>
        </g>
        <g font-size="12" fill="#9AA0AB" font-family="Barlow, sans-serif">
          <text x="0" y="24">82.5</text>
          <text x="0" y="74">77.5</text>
          <text x="0" y="124">72.5</text>
          <text x="0" y="174">67.5</text>
        </g>
        <polyline points="44,145 85,120 126,120 167,95 208,70 249,70 289,45 330,45" fill="none" stroke="#C8F135" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#101216" stroke="#C8F135" stroke-width="2.5">
          <circle cx="44" cy="145" r="4.5"/>
          <circle cx="85" cy="120" r="4.5"/>
          <circle cx="126" cy="120" r="4.5"/>
          <circle cx="167" cy="95" r="4.5"/>
          <circle cx="208" cy="70" r="4.5"/>
          <circle cx="249" cy="70" r="4.5"/>
          <circle cx="289" cy="45" r="4.5"/>
        </g>
        <circle cx="330" cy="45" r="7" fill="#C8F135"/>
      </svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:600;letter-spacing:1.5px;color:#9AA0AB">RECENT SESSIONS</div>
      <div style="display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:12px;background:#1A1D23;border:1px solid #2C313B"><span style="font-size:14px;color:#9AA0AB">Sun 11 Oct</span><span style="font-size:16px">80 × 8 · 80 × 8 · 80 × 8 · 80 × 8</span></div>
      <div style="display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:12px;background:#1A1D23;border:1px solid #2C313B"><span style="font-size:14px;color:#9AA0AB">Thu 8 Oct</span><span style="font-size:16px">80 × 8 · 80 × 8 · 80 × 7 · 80 × 6</span></div>
    </div>
  </div>

  <nav aria-label="Main" style="display:flex;height:76px;box-sizing:border-box;border-top:1px solid #2C313B;background:#101216;padding:0 8px;margin-top:12px">
    <button style="flex:1;background:none;border:0;color:#9AA0AB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
    <button style="flex:1;background:none;border:0;color:#9AA0AB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Plans</button>
    <button style="flex:1;background:none;border:0;color:#C8F135;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/></svg>Progress</button>
    <button style="flex:1;background:none;border:0;color:#9AA0AB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.5"/></svg>Goals</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
