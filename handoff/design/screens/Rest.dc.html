<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#101216;color:#F3F4F1;font-family:'Barlow',system-ui,sans-serif;overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 12px 0 12px;height:64px;box-sizing:border-box">
    <span style="padding:0 8px;font-size:16px;font-weight:500;color:#9AA0AB">Barbell Bench Press</span>
    <span style="padding:0 8px;font-size:16px;font-weight:500;color:#9AA0AB">2 / 5</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 20px 0 20px;min-height:0">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="font-size:12px;font-weight:600;letter-spacing:1.5px;color:#9AA0AB">SET 3 LOGGED</div>
      <div style="font-size:22px;font-weight:500">82.5 kg × 7</div>
    </div>

    <div style="position:relative;width:260px;height:260px">
      <svg width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="72 seconds of rest left" style="transform:rotate(-90deg)">
        <circle cx="130" cy="130" r="116" fill="none" stroke="#232730" stroke-width="14"/>
        <circle cx="130" cy="130" r="116" fill="none" stroke="#C8F135" stroke-width="14" stroke-linecap="round" stroke-dasharray="729" stroke-dashoffset="146"/>
      </svg>
      <div style="position:absolute;left:0;top:0;width:260px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:84px;font-weight:700;line-height:1">1:12</div>
        <div style="font-size:14px;color:#9AA0AB">of 1:30 rest</div>
      </div>
    </div>

    <div style="display:flex;gap:12px">
      <button style="width:120px;height:52px;border-radius:14px;border:1px solid #2C313B;background:#1A1D23;color:#F3F4F1;font-family:inherit;font-size:17px;font-weight:500;cursor:pointer">−15 s</button>
      <button style="width:120px;height:52px;border-radius:14px;border:1px solid #2C313B;background:#1A1D23;color:#F3F4F1;font-family:inherit;font-size:17px;font-weight:500;cursor:pointer">+15 s</button>
    </div>

    <div style="width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:#1A1D23;border:1px solid #2C313B">
      <div style="font-size:12px;font-weight:600;letter-spacing:1.5px;color:#9AA0AB">NEXT · SET 4</div>
      <div style="font-size:17px">82.5 kg · beat 7 reps if you can</div>
    </div>
  </div>

  <div style="padding:12px 20px 28px 20px">
    <a href="Session.dc.html" style="display:flex;align-items:center;justify-content:center;height:60px;border-radius:14px;background:#C8F135;color:#101216;font-size:19px;font-weight:600;text-decoration:none">Skip rest</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
