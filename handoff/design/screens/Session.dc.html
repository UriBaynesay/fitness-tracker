<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#101216;color:#F3F4F1;font-family:'Barlow',system-ui,sans-serif;overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 12px 0 12px;height:64px;box-sizing:border-box">
    <a href="Main.dc.html" style="display:flex;align-items:center;height:44px;padding:0 8px;font-size:16px;font-weight:500;color:#9AA0AB;text-decoration:none">Exit</a>
    <div style="display:flex;align-items:center;justify-content:flex-end;height:44px;min-width:56px;padding:0 8px;font-size:16px;font-weight:500;color:#9AA0AB">2 / 5</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;gap:14px;padding:12px 20px 0 20px;min-height:0">
    <div style="display:flex;flex-direction:column;gap:6px">
      <h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:700;line-height:1;text-transform:uppercase">Barbell Bench Press</h1>
      <div style="font-size:15px;color:#9AA0AB">Target 4 × 8 · Add weight when every set hits 8</div>
    </div>

    <div style="border:1px solid #C8F135;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:#1A1D23">
      <div style="font-size:12px;font-weight:600;letter-spacing:1.5px;color:#C8F135">HINT</div>
      <div style="font-size:16px;line-height:1.35">You hit 8 on every set last time. Try <strong style="font-weight:600">82.5 kg</strong> and aim for 8 reps.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-radius:12px;background:#1A1D23;border:1px solid #2C313B">
        <span style="font-size:13px;font-weight:600;letter-spacing:1.5px;color:#9AA0AB">SET 1</span>
        <span style="font-size:18px;font-weight:500">82.5 kg × 6</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C8F135" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-radius:12px;background:#1A1D23;border:1px solid #2C313B">
        <span style="font-size:13px;font-weight:600;letter-spacing:1.5px;color:#9AA0AB">SET 2</span>
        <span style="font-size:18px;font-weight:500">82.5 kg × 6</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C8F135" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:#1A1D23;border:2px solid #C8F135">
        <div style="font-size:13px;font-weight:600;letter-spacing:1.5px;color:#C8F135">SET 3</div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button aria-label="Decrease weight" style="width:56px;height:56px;border-radius:14px;border:1px solid #2C313B;background:#232730;color:#F3F4F1;font-size:28px;line-height:1;cursor:pointer">−</button>
          <div style="display:flex;align-items:baseline;gap:6px"><span style="font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:700;line-height:1">82.5</span><span style="font-size:16px;color:#9AA0AB">kg</span></div>
          <button aria-label="Increase weight" style="width:56px;height:56px;border-radius:14px;border:1px solid #2C313B;background:#232730;color:#F3F4F1;font-size:28px;line-height:1;cursor:pointer">+</button>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <button aria-label="Decrease reps" style="width:56px;height:56px;border-radius:14px;border:1px solid #2C313B;background:#232730;color:#F3F4F1;font-size:28px;line-height:1;cursor:pointer">−</button>
          <div style="display:flex;align-items:baseline;gap:6px"><span style="font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:700;line-height:1">6</span><span style="font-size:16px;color:#9AA0AB">reps</span></div>
          <button aria-label="Increase reps" style="width:56px;height:56px;border-radius:14px;border:1px solid #2C313B;background:#232730;color:#F3F4F1;font-size:28px;line-height:1;cursor:pointer">+</button>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-radius:12px;border:1px dashed #2C313B;color:#9AA0AB">
        <span style="font-size:13px;font-weight:600;letter-spacing:1.5px">SET 4</span>
        <span style="font-size:16px">Target 8 reps</span>
        <span style="width:24px"></span>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;padding:12px 20px 28px 20px">
    <a href="Rest.dc.html" style="display:flex;align-items:center;justify-content:center;height:60px;border-radius:14px;background:#C8F135;color:#101216;font-size:19px;font-weight:600;text-decoration:none">Complete set</a>
    <div style="font-size:14px;color:#9AA0AB;text-align:center">Up next: Incline Dumbbell Press</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
